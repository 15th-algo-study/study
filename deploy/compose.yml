# 서버(다중 사용자) 배포
#   cp deploy/.env.example deploy/.env   # DOMAIN 등 수정
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
# 자세한 절차: deploy/README.md
name: algo-study-server

services:
  app:
    build:
      context: ..
      dockerfile: app/Dockerfile
    image: algo-study-app:server
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - MULTI_USER=1
      - RUNNER_UID=10001
      - RUNNER_SLOTS=${RUNNER_SLOTS:-1}
      - RUNS_DIR=/runs/jobs
      - RUNNER_SLOTS_DIR=/runs/slots
      - SYNC_INTERVAL_MIN=${SYNC_INTERVAL_MIN:-5}
      - ANON_RUN=${ANON_RUN:-1}
      - GA_MEASUREMENT_ID=${GA_MEASUREMENT_ID:-}
    volumes:
      - ..:/workspace                 # 이 서버의 study clone (문제·config·git). 앱이 5분마다 origin/main 으로 갱신
      - data:/data                    # 세션·사용자별 토큰·작성 중 코드 (root 만 읽을 수 있음)
      - gradle-home:/gradle-home      # Gradle 캐시
      - runs:/runs                    # 채점 임시 폴더·슬롯별 build 폴더 (제출 코드 실행 사용자 소유)
    expose:
      - "15015"
    mem_limit: ${APP_MEM_LIMIT:-3g}
    pids_limit: 1024
    # 상태 표시용 (docker ps 의 healthy/unhealthy). 멈춘 앱을 재시작하는 건 호스트의 워치독(deploy/watchdog.sh)이 한다
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:15015/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?deploy/.env 에 DOMAIN 을 지정하세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data              # Let's Encrypt 인증서
      - caddy-config:/config

volumes:
  data:
  gradle-home:
  runs:
  caddy-data:
  caddy-config:
